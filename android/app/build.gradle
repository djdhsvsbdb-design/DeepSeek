plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.dsh.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.dsh.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
