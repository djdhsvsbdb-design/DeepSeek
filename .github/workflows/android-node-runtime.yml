name: Android Node Runtime

on:
  push:
    branches: [android-runtime-port]
    paths:
      - ".github/workflows/android-node-runtime.yml"
      - "android/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "ANDROID_PORT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-node-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install Harness workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Harness web frontend
        run: pnpm --filter @deepseek-ai/dsh-web-frontend build
      - name: Stage frontend into Android assets
        run: bash android/scripts/stage-web-assets.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc-multilib g++-multilib
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python build helper
        run: python -m pip install setuptools
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Checkout Node mobile build recipe
        uses: actions/checkout@v4
        with:
          repository: fogtape/nodejs-mobile
          ref: recipe
          path: node-mobile
      - name: Materialize pinned Node source
        working-directory: node-mobile
        run: scripts/prepare.sh
      - name: Build Node 24 for Android arm64
        working-directory: node-mobile/out
        run: |
          ./tools/android_build.sh "$ANDROID_HOME/ndk/27.3.13750724" 24 arm64
      - name: Stage runtime for Android JNI
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/cpp/node_headers
          cp node-mobile/out/out_android/arm64-v8a/libnode.so android/app/src/main/jniLibs/arm64-v8a/
          cp -R node-mobile/out/out_android/libnode/include/node/. android/app/src/main/cpp/node_headers/
      - name: Build APK with embedded Node
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-node24-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
